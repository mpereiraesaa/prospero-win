name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host contracts and publication audit
        run: make -j2 all
      - name: ASan and UBSan
        run: make -j2 sanitize
