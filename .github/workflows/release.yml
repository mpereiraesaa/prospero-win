# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# Pushing a version tag (v0.1.0) checks that tag and opens a draft release
# for it. The app folder itself needs the PS5 SDK and a few hours of Wine
# builds, so the maintainer builds it and attaches it with
# tools/publish_release.sh, then publishes the draft.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependencies
        run: python3 -m pip install --user pyyaml==6.0.1
      - name: Host contracts and publication audit
        run: make -j2 all
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --draft --verify-tag --title "prospero-win $TAG" \
              --notes-file .github/release-notes.md --generate-notes
          fi
